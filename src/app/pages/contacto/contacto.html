<div class="container my-5" style="max-width: 600px;">
  <div class="card bg-dark text-white p-4 border-secondary shadow">
    <h2 class="text-warning fw-bold text-center mb-4">Contáctanos</h2>
    <form (ngSubmit)="$event.preventDefault()">
      <div class="mb-3">
        <label class="form-label text-secondary">Nombre Completo</label>
        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="Tu nombre" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary">Correo Electrónico</label>
        <input type="email" class="form-control bg-dark text-white border-secondary" placeholder="correo@ejemplo.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary">Mensaje o Consulta</label>
        <textarea class="form-control bg-dark text-white border-secondary" rows="4" placeholder="Escribe tu mensaje..." required></textarea>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold">Enviar Mensaje</button>
    </form>
  </div>
</div>
