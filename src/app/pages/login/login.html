<div class="container my-5" style="max-width: 450px;">
  <div class="card bg-dark text-white p-4 shadow-lg border-secondary">
    <div class="text-center mb-4">
      <i class="bi bi-person-circle fs-1 text-warning"></i>
      <h3 class="text-warning fw-bold mt-2">Iniciar Sesión</h3>
      <p class="text-secondary small">Ingresa para acceder al Panel Administrativo</p>
    </div>
    
    <div *ngIf="errorMsg" class="alert alert-danger py-2" role="alert">
      {{ errorMsg }}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label text-secondary">Nombre Completo</label>
        <input type="text" class="form-control bg-dark text-white border-secondary" [(ngModel)]="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary">Correo Electrónico</label>
        <input type="email" class="form-control bg-dark text-white border-secondary" [(ngModel)]="email" name="email" placeholder="cliente@donarosa.com" required>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold mt-2">
        <i class="bi bi-box-arrow-in-right"></i> Ingresar
      </button>
    </form>
  </div>
</div>
